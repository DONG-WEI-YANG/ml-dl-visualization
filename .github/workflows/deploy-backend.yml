name: Deploy Backend to HF Space

on:
  push:
    branches: [master]
    paths:
      - 'platform/backend/**'
      - 'curriculum/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  deploy:
    needs: test
    # Enable only after a verified backup and durable storage migration.
    if: vars.HF_STORAGE_MIGRATION_VERIFIED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install huggingface_hub

      - name: Deploy backend to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'SCRIPT'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = "kevin19830331/ml-dl-viz-api"

          # A single upload commit prevents intermediate builds with the generic
          # Dockerfile or missing curriculum. Staging excludes local data/secrets.
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, "platform/backend/scripts")
          from stage_hf_deployment import stage_deployment

          with tempfile.TemporaryDirectory() as temporary:
              staged = Path(temporary) / "space"
              stage_deployment(Path.cwd(), staged)
              api.upload_folder(
                  folder_path=str(staged),
                  repo_id=repo_id,
                  repo_type="space",
                  commit_message="deploy: atomic backend, curriculum and HF configuration",
              )
          print("Deployment source uploaded; runtime verification still required.")
          SCRIPT
