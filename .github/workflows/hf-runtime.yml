name: HF runtime verification

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the Space to verify persistence (no factory reset)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install huggingface_hub
      - name: Inspect runtime and durable files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RESTART: ${{ inputs.restart }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = 'kevin19830331/ml-dl-viz-api'
          info = api.space_info(repo)
          print('Source SHA:', info.sha)
          print('Runtime:', info.runtime.stage, info.runtime.raw.get('sha'))
          for item in api.list_bucket_tree('kevin19830331/ml-dl-viz-private-data', recursive=True):
              print('Durable file:', item.path, 'bytes:', getattr(item, 'size', None))
          if os.environ['RESTART'] == 'true':
              assert info.runtime.stage == 'RUNNING', 'Wait for the current build to finish'
              api.restart_space(repo)
              print('Normal restart requested; verify application state after startup.')
          PY
      - name: Recent runtime logs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf spaces logs kevin19830331/ml-dl-viz-api --tail 100
      - name: Verify stored database during maintenance
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import tempfile
          from pathlib import Path
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          # Inspection only; not a replacement for a consistent live SQLite backup.
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / 'app.db'
              api.download_bucket_files('kevin19830331/ml-dl-viz-private-data', files=[('app.db', str(path))])
              with sqlite3.connect(path.as_uri() + '?mode=ro', uri=True) as db:
                  assert db.execute('PRAGMA integrity_check').fetchall() == [('ok',)]
                  assert db.execute('PRAGMA foreign_key_check').fetchall() == []
                  print('Stored SQLite integrity and foreign keys: OK')
                  for table in ('users', 'quiz_questions', 'learning_events', 'rag_chunks'):
                      print(table, db.execute('SELECT COUNT(*) FROM ' + table).fetchone()[0])
                  assert db.execute('SELECT COUNT(*) FROM quiz_questions').fetchone()[0] >= 54
          PY
      - name: Recent build logs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf spaces logs kevin19830331/ml-dl-viz-api --build --tail 50
